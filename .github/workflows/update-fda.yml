name: Update FDA licensee data

on:
  schedule:
    - cron: '17 20 * * 0'   # ทุกวันจันทร์ 03:17 น. เวลาไทย
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch from catalog.fda.moph.go.th
        run: python scripts/fetch_fda.py data
      - name: Commit if data changed
        run: |
          python - <<'PY'
          import json, subprocess
          new = json.load(open('data/licensees.json'))
          try:
              old = json.loads(subprocess.check_output(['git', 'show', 'HEAD:data/licensees.json']))
          except Exception:
              old = {}
          if old.get('rows') == new['rows'] and old.get('resources') == new['resources']:
              subprocess.run(['git', 'checkout', '--', 'data/licensees.json'])
              print('no change')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/licensees.json
          git diff --cached --quiet || git commit -m "Update FDA licensee snapshot"
          git push
